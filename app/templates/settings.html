{% extends "base.html" %}{% block content %}<section class="page-intro"><div><p class="eyebrow">O vosso espaço</p><h1>Configurações</h1><p class="intro-copy">Definam os dados que alimentam o dashboard.</p></div></section><form method="post" class="card form-grid record-form"><label>Nome do projeto<input name="project_name" value="{{ settings.project_name }}" required></label><label>Data do casamento<input type="date" name="wedding_date" value="{{ settings.wedding_date.strftime('%Y-%m-%d') if settings.wedding_date else '' }}"></label><label>Orçamento total<input name="total_budget" type="number" step="0.01" value="{{ settings.total_budget }}"></label><label>Moeda<select name="currency"><option value="EUR" {% if settings.currency == 'EUR' %}selected{% endif %}>EUR (€)</option><option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>USD ($)</option></select></label><div class="form-actions"><span>Alterações guardadas na base de dados.</span><button class="primary-button">Guardar configurações</button></div></form>{% endblock %}
