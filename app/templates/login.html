<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · {{ app_name }}</title><link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}"></head><body class="auth-page"><main class="auth-card"><span class="brand-mark">LV</span><p class="eyebrow">Bem-vindos de volta</p><h1>Entrar no vosso espaço.</h1>{% if request.query_params.get('error') %}<p class="form-error">Password incorreta. Tentem novamente.</p>{% endif %}<form method="post" class="form-grid"><label>Utilizador<select name="user_id">{% for user in users %}<option value="{{ user.id }}">{{ user.name }}</option>{% endfor %}</select></label><label>Password<input name="password" type="password" required autofocus></label><button class="primary-button" type="submit">Entrar</button></form></main></body></html>
