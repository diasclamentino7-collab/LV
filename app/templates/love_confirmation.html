{% extends "auth_base.html" %}
{% block title %}Uma pergunta · {{ display_app_name|default(app_name) }}{% endblock %}
{% block card_class %}love-card{% endblock %}
{% block content %}
<span class="brand-mark">LV</span>
<p class="eyebrow">Antes de entrar</p>
<h1>Amas-me? ♡</h1>
<p>Uma resposta importante antes de continuar para o vosso espaço.</p>
<form method="post" class="love-actions">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button class="primary-button" name="answer" value="sim">Sim</button>
  <button class="secondary-button" name="answer" value="simmmm">Simmmm</button>
</form>
{% endblock %}
