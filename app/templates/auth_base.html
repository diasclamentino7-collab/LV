<!doctype html>
<html lang="pt-PT" data-motion="{{ ui_settings.motion_preference|default('full') if ui_settings is defined else 'full' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="{{ theme.primary if theme is defined else '#D88BA7' }}">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <title>{% block title %}{{ display_app_name|default(app_name) }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/motion.css') }}">
    {% if theme is defined %}<style>:root{--primary:{{ theme.primary }};--primary-soft:{{ theme.secondary }};--accent:{{ theme.accent }};--background:{{ theme.background }};{% if theme.on_primary is defined %}--on-primary:{{ theme.on_primary }};{% endif %}}</style>{% endif %}
    <script src="{{ url_for('static', path='js/motion.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-card {% block card_class %}{% endblock %}" data-motion-page data-motion-card data-motion-tilt="1.5">
      {% block content %}{% endblock %}
    </main>
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
    </script>
  </body>
</html>
