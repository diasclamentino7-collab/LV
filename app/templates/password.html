<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/app.css"><title>Alterar password</title></head><body class="auth-page"><main class="auth-card"><a href="/dashboard" class="text-button">← Voltar</a><h1>Alterar password</h1>{% if request.query_params.get('error') %}<p class="form-error">Verifique os dados e use pelo menos 8 caracteres.</p>{% endif %}<form method="post" class="form-grid"><label>Password atual<input type="password" name="current_password" required></label><label>Nova password<input type="password" name="new_password" minlength="8" required></label><button class="primary-button">Guardar password</button></form></main></body></html>
