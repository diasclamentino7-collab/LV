[project]
name = "lv-wedding-planner"
version = "0.1.0"
description = "Modular wedding-planning platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.34,<1.0", "jinja2>=3.1,<4.0", "sqlalchemy>=2.0,<3.0", "alembic>=1.15,<2.0", "pydantic-settings>=2.7,<3.0", "python-multipart>=0.0.20,<1.0", "itsdangerous>=2.2,<3.0", "tzdata>=2025.2,<2027.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
